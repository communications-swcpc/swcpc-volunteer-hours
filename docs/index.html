<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWCPC Volunteer Hours App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo {
      width: 72px;
      height: 72px;
      background: #2d6a4f;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 36px;
    }
    h1 {
      color: #1a1a1a;
      font-size: 22px;
      margin-bottom: 8px;
    }
    .org {
      color: #2d6a4f;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    p {
      color: #555;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .stores {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .store-btn {
      display: block;
      padding: 14px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      text-align: center;
    }
    .ios-btn { background: #000; color: #fff; }
    .android-btn { background: #1a73e8; color: #fff; }
    .store-label { font-size: 12px; font-weight: 400; display: block; opacity: 0.8; }
    .note {
      font-size: 13px;
      color: #999;
      margin-top: 20px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🌿</div>
    <div class="org">Southwest Corridor Park Conservancy</div>
    <h1>Volunteer Hours App</h1>
    <p>Log your volunteer hours and submit reimbursements from your phone. Download the free app for your device.</p>

    <div class="stores" id="stores">
      <a class="store-btn ios-btn" id="iosBtn" href="https://apps.apple.com/app/id6775980297">
        <span class="store-label">Download on the</span>
        App Store
      </a>
      <a class="store-btn android-btn" id="androidBtn" href="https://play.google.com/store/apps/details?id=org.swcpc.volunteerhours">
        <span class="store-label">Get it on</span>
        Google Play
      </a>
    </div>

    <p class="note">In the app, sign in with the email address you use with SWCPC.</p>
  </div>

  <script>
    // On Android, list Google Play first; iPhone and desktop keep the App Store first.
    if (/Android/i.test(navigator.userAgent)) {
      const stores = document.getElementById('stores');
      stores.insertBefore(document.getElementById('androidBtn'), document.getElementById('iosBtn'));
    }
  </script>
</body>
</html>
